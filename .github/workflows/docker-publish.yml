# Builds the Docker image and pushes it to Docker Hub (kaypee90/zebrok).
# Runs when a version tag (e.g. v0.1.0) is pushed, or manually.
# Requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

name: Docker image

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: kaypee90/zebrok
        tags: |
          type=semver,pattern={{version}}
          type=sha
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
