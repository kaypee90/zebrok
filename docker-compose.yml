services:
  worker:
      build: .
      volumes:
        - ./:/code
      environment:
        - WORKER_HOST=worker
        - WORKER_PORT=5690
      expose:
        - "5690"
      command: sleep 365d

  publisher:
      build: .
      volumes:
        - ./:/code
      environment:
        - WORKER_HOST=worker
        - WORKER_PORT=5690
      command: sleep 365d
      depends_on:
        - worker
